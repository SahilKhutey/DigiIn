name: Security Audit & Threat-Model Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly Monday scan
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Authoritative Dependency Vulnerability Security Gate
  #    Strict enforcement: Any known high/critical CVE fails the pipeline immediately.
  dependency-security-gate:
    name: Dependency Vulnerability Audit (Strict Gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pip-audit on Backend Dependencies (No suppression)
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Run npm audit on Frontend Dependencies (No suppression)
        working-directory: apps/web
        run: |
          npm audit --audit-level=high

  # 2. Static Application Security Testing (SAST) & Secret Hygiene
  sast-and-secret-scanning:
    name: SAST Analysis & Secret Hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAST Tools
        run: |
          python -m pip install --upgrade pip bandit

      - name: Run Bandit AST Security Scan on Python Codebase
        run: |
          bandit -r services/api/app -ll

      - name: Verify Secret & Synthetic Data Boundaries
        run: |
          python -c "
          import re, os
          disallowed_patterns = [
              (re.compile(r'-----BEGIN RSA PRIVATE KEY-----'), 'Unencrypted RSA private key'),
              (re.compile(r'ghp_[A-Za-z0-9_]{36}'), 'GitHub Personal Access Token'),
              (re.compile(r'AKIA[0-9A-Z]{16}'), 'AWS Access Key'),
          ]
          clean = True
          for root, _, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root or '.pytest_cache' in root:
                  continue
              for f in files:
                  if f.endswith(('.py', '.ts', '.tsx', '.json', '.yml', '.yaml', '.env.example')):
                      p = os.path.join(root, f)
                      try:
                          content = open(p, 'r', encoding='utf-8', errors='ignore').read()
                          for pattern, label in disallowed_patterns:
                              if pattern.search(content):
                                  print(f'🚨 SECRET LEAK DETECTED in {p}: {label}')
                                  clean = False
                      except Exception:
                          pass
          assert clean, 'Secret scan failed: Disallowed secret pattern detected in source files'
          print('✅ Secret scan clean: No real credentials or unencrypted private keys found in codebase.')
          "

  # 3. Comprehensive Cryptographic Invariants & Threat-Model Security Suite
  threat-model-and-crypto-suite:
    name: Cryptographic Invariants & Threat-Model Gate
    runs-on: ubuntu-latest
    needs: [dependency-security-gate, sast-and-secret-scanning]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Master Threat-Model Security & Cryptographic Invariants Suite
        env:
          PYTHONPATH: "services/api:."
        run: |
          python tests/test_security_threat_model.py
