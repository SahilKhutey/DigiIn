services:
  # 1. Backend REST API & Verification Service (FastAPI / Python)
  - type: web
    name: digiin-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: MOCK_AUTH
        value: "true"
      - key: MOCK_KYC
        value: "true"
      - key: MOCK_GOVERNMENT_APIS
        value: "true"
      - key: MOCK_NOTIFICATIONS
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://digiin.vercel.app,https://*.vercel.app"
      - key: DIGIIN_DATABASE_URL
        sync: false # Set to your Supabase PostgreSQL connection URI in Render Dashboard
