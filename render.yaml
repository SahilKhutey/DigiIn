services:
  # 1. Frontend Web Service (Vite + React Static Site)
  - type: web
    name: digiin-web
    runtime: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: digiin-api
          property: host
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"

  # 2. Backend API Service (FastAPI / Python)
  - type: web
    name: digiin-api
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: MOCK_AUTH
        value: "true"
      - key: MOCK_KYC
        value: "true"
      - key: MOCK_GOVERNMENT_APIS
        value: "true"
      - key: MOCK_NOTIFICATIONS
        value: "true"
      - key: DIGIIN_DATABASE_URL
        fromDatabase:
          name: digiin-db
          property: connectionString

  # 3. Asynchronous Worker Service
  - type: worker
    name: digiin-worker
    runtime: python
    rootDir: services/api
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker_main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEMO_MODE
        value: "true"
      - key: DIGIIN_DATABASE_URL
        fromDatabase:
          name: digiin-db
          property: connectionString

databases:
  - name: digiin-db
    databaseName: digilocker_x
    user: digilocker
    plan: free
