services:
  api:
    build:
      context: ./services/api
    environment:
      DIGIN_WEB_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api
