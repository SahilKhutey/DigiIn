version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: digilocker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: digilocker
      POSTGRES_PASSWORD: digilocker_dev_password
      POSTGRES_DB: digilocker_x
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: digilocker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: digilocker-api
    restart: unless-stopped
    environment:
      DIGIIN_DATABASE_URL: "postgresql://digilocker:digilocker_dev_password@postgres:5432/digilocker_x"
      REDIS_URL: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: digilocker-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
