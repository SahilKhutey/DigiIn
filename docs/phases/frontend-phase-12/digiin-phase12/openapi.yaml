openapi: 3.0.3
info:
  title: DigiIn Sovereign Document & Verification API
  version: 1.2.0
  description: OpenAPI v1 specification for DigiIn with DigiLocker Integration & Document Pipeline.
servers:
  - url: http://localhost:8080/v1
    description: Development API Server
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Operational status
  /digilocker/connect:
    get:
      summary: Initiate DigiLocker OAuth authorization flow
      responses:
        '302':
          description: Redirects to DigiLocker authorization endpoint
  /digilocker/callback:
    get:
      summary: Handle DigiLocker OAuth callback
      responses:
        '200':
          description: Connection established
  /digilocker/status:
    get:
      summary: Get DigiLocker connection status for authenticated user
      responses:
        '200':
          description: Connection metadata
  /digilocker/documents:
    get:
      summary: Discover available documents from DigiLocker
      responses:
        '200':
          description: List of discovered documents
  /digilocker/documents/{id}/retrieve:
    post:
      summary: Queue asynchronous document retrieval job
      responses:
        '202':
          description: Document retrieval job queued
  /documents:
    get:
      summary: List citizen's retrieved and available documents
      responses:
        '200':
          description: List of documents
  /documents/{id}:
    get:
      summary: Get document details and provenance record
      responses:
        '200':
          description: Document and provenance metadata
    delete:
      summary: Delete retrieved document according to retention rules
      responses:
        '200':
          description: Document deleted
  /documents/{id}/verify:
    post:
      summary: Queue asynchronous verification job for document
      responses:
        '202':
          description: Verification job queued
  /verifications/{id}:
    get:
      summary: Get verification job outcome and check breakdown
      responses:
        '200':
          description: Verification result
